<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bà Nà Hills Camera</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        
        /* Khung hiển thị Camera chiếm toàn bộ màn hình */
        #camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        video {
            width: 100%;
            height: 80%;
            object-fit: cover;
        }

        /* Watermark thu nhỏ (Cũ) */
        .watermark {
            position: absolute;
            bottom: 150px;
            left: 20px;
            color: #ffffff;
            font-size: 12px; /* Thu nhỏ còn 1/2 */
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        .time { 
            display: block;       /* Chuyển span thành dạng khối */
            margin-bottom: 5px;  /* Cách dòng bên dưới chính xác 10px */
            font-size: 14px; 
            font-weight: bold; 
        } 
        .location { 
            display: block;       /* Chuyển span thành dạng khối */
            font-size: 10px; 
        }

        /* Logo mới ở góc phải */
        #logo-container {
            position: absolute;
            bottom: 150px;
            right: 20px;
            width: 20%; /* 20% độ rộng của ảnh */
            height: auto;
            z-index: 10;
            pointer-events: none;
        }
        #logo-container img {
            width: 100%;
            height: auto;
        }

        /* Nút chụp ảnh */
        #shutter-button {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            background: #ffffff;
            border: 5px solid #cccccc;
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
        }
    </style>
</head>
<body>

<div id="camera-container">
    <video id="video" autoplay playsinline></video>
    
    <div class="watermark">
        <div id="display-datetime">
            <span class="time">--:--:-- --/--/--</span>
            <span class="location">Sun World Ba Na Hills, Đà Nẵng</span>
        </div>
    </div>

    <div id="logo-container">
        <img src="logo.svg" alt="Timemark Logo">
    </div>

    <button id="shutter-button"></button>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    const video = document.getElementById('video');
    const displayDateTime = document.getElementById('display-datetime');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // 1. Khởi động Camera điện thoại
    async function initCamera() {
        try {
            const constraints = { video: { facingMode: "environment" }, audio: false };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
        } catch (err) {
            alert("Lỗi: Không thể mở camera. Hãy đảm bảo bạn dùng HTTPS hoặc cho phép quyền Camera.");
        }
    }

   // Tạo phút giả lập (16:55 - 16:59) MỘT LẦN duy nhất khi tải trang 
    // để phút không bị nhảy lung tung mỗi giây
    const customMinutes = Math.floor(Math.random() * (59 - 55 + 1)) + 55;

    // 2. Cập nhật đồng hồ (Có thêm Giây nhảy liên tục)
    function updateClock() {
        const now = new Date();
        const dateStr = now.toLocaleDateString('vi-VN');
        
        // Lấy giây hiện tại của hệ thống (thêm '0' ở trước nếu giây < 10)
        const seconds = String(now.getSeconds()).padStart(2, '0');
        
        // Ghép Giờ (16) : Phút (random) : Giây (thực tế)
        const customTime = `16:${customMinutes}:${seconds}`;
        
        const location = "Sun World Ba Na Hills, Đà Nẵng";
        
        const timeText = `<span class="time">${dateStr} ${customTime}</span>`;
        const locationText = `<span class="location">${location}</span>`;
        
        // Hiển thị ra màn hình
        displayDateTime.innerHTML = `${timeText}<br>${locationText}`;
    }

    // Cho đồng hồ cập nhật mỗi 1 giây (1000ms)
    setInterval(updateClock, 1000);

  

    // 3. Xử lý chụp ảnh và vẽ Canvas (Watermark + Logo)
    function takePhoto() {
        // Tải ảnh video lên canvas
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);

        // Biên độ vẽ trên canvas dựa trên kích thước ảnh
        const margin = canvas.width * 0.02;

        // Vẽ chữ Watermark thu nhỏ
        ctx.font = "bold 20px Arial"; // Thu nhỏ còn 1/2
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0,0,0,0.8)";
        ctx.shadowBlur = 4;
        
        // Vẽ Ngày/Giờ
        const timeText = displayDateTime.querySelector('.time').innerText;
        ctx.fillText(timeText, margin, canvas.height - margin * 3.5);
        
        // Vẽ Địa điểm
        ctx.font = "12px Arial"; // Thu nhỏ còn 1/2
        const locText = displayDateTime.querySelector('.location').innerText;
        ctx.fillText(locText, margin, canvas.height - margin * 2.5);

        // Vẽ Logo SVG
        const logoImg = new Image();
        logoImg.src = 'logo.svg';
        logoImg.onload = () => {
            const logoWidth = canvas.width * 0.20; // 20% độ rộng của ảnh
            const logoHeight = logoImg.height * (logoWidth / logoImg.width); // Giữ tỷ lệ
            const logoX = canvas.width - logoWidth - margin;
            const logoY = canvas.height - logoHeight - margin;
            
            ctx.drawImage(logoImg, logoX, logoY, logoWidth, logoHeight);

            // Tải ảnh xuống
            const link = document.createElement('a');
            link.download = `BanaHills_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        };
    }

    document.getElementById('shutter-button').addEventListener('click', takePhoto);

    initCamera();
</script>
</body>
</html>
