


<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bana Hills Camera</title>
    <style>
        /* Tối ưu cho màn hình điện thoại */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; padding-bottom:50px ;
            background: #000; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* Khung nhìn Camera */
       /* 1. Khung nhìn Camera: Cho phép chiếm toàn bộ màn hình */
#viewport {
    position: absolute;
    top: 0; 
    left: 0;
    width: 100%; 
    height: 100%;
    overflow: hidden;
    background: #000;
    z-index: 1;
}

/* 2. Bảng điều khiển: Ép cách đáy 300px và nổi lên trên Camera */
.bottom-bar {
    position: absolute;
    bottom: 100px; /* Cách viền dưới chính xác 300px */
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px; /* Khoảng cách giữa ô chỉnh giờ và nút chụp */
    z-index: 100; /* Đảm bảo luôn nằm trên cùng */
    background: transparent; /* Làm trong suốt để không che mất cảnh bên dưới */
}
        video {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* Lớp phủ thông tin (Watermark) */
        #watermark {
            position: absolute;
            bottom: 40px;
            left: 20px;
            color: #ffb400; /* Màu cam vàng vintage */
            text-shadow: 2px 2px 3px rgba(0,0,0,0.7);
            pointer-events: none;
            z-index: 10;
        }
        .loc-text { font-size: 16px; letter-spacing: 1px; margin-bottom: 2px; text-transform: uppercase; }
        .time-text { font-size: 22px; font-weight: 600; font-family: monospace; }

        

        
        .time-picker-wrapper {
            color: #ccc;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="time"] {
            background: #333;
            border: 1px solid #555;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 16px;
        }

        /* Nút chụp hình */
        .shutter-btn {
            width: 70px; height: 70px;
            background: #fff;
            border-radius: 50%;
            border: 5px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            active { background: #ccc; }
        }
        .shutter-inner {
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 2px solid #000;
        }

        /* Thông báo */
        #toast {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white;
            padding: 8px 20px; border-radius: 20px;
            font-size: 13px; display: none; z-index: 100;
        }
    </style>
</head>
<body>

<div id="toast">Đã lưu ảnh vào máy</div>

<div id="viewport">
    <video id="video" autoplay playsinline></video>
    
    <div id="watermark">
        <div class="loc-text">📍 Sun World Ba Na Hills</div>
        <div class="time-text" id="display-time">09/05/2026 16:55:00</div>
    </div>
</div>

<div class="bottom-bar">
    <div class="time-picker-wrapper">
        Chỉnh giờ: 
        <input type="time" id="time-input" value="16:55">
    </div>

    <div class="shutter-btn" onclick="takePhoto()">
        <div class="shutter-inner"></div>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    const video = document.getElementById('video');
    const displayTime = document.getElementById('display-time');
    const timeInput = document.getElementById('time-input');
    const toast = document.getElementById('toast');

    // Khởi động Camera điện thoại
    async function initCamera() {
        try {
            const constraints = {
                video: { 
                    facingMode: "environment", // Dùng camera sau
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                },
                audio: false
            };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
        } catch (err) {
            alert("Lỗi: Không thể mở camera. Hãy đảm bảo bạn dùng HTTPS hoặc chạy trên Localhost.");
        }
    }

    // Cập nhật đồng hồ hiển thị
    function updateClock() {
        const now = new Date();
        const d = String(now.getDate()).padStart(2, '0');
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const y = now.getFullYear();
        
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const customTime = timeInput.value; // Lấy giờ từ ô input

        displayTime.innerText = `${d}/${m}/${y} ${customTime}:${seconds}`;
    }

    setInterval(updateClock, 1000);

    // Xử lý chụp ảnh
   function takePhoto() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // 1. Thiết lập kích thước canvas theo video
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // 2. Vẽ ảnh từ camera lên canvas
        ctx.drawImage(video, 0, 0);

        // 3. Chèn mã Watermark (Ngày giờ/Địa điểm)
        const fontSize = Math.round(canvas.width * 0.04);
        ctx.shadowColor = "rgba(0,0,0,0.8)";
        ctx.shadowBlur = 10;
        ctx.fillStyle = "#ffb400";
        
        ctx.font = `bold ${fontSize * 0.7}px Arial`;
        ctx.fillText("📍 SUN WORLD BA NA HILLS", 40, canvas.height - (fontSize * 2.5));
        
        ctx.font = `bold ${fontSize}px monospace`;
        ctx.fillText(displayTime.innerText, 40, canvas.height - fontSize);

        // 4. Hiệu ứng nháy màn hình
        video.style.opacity = "0.2";
        setTimeout(() => video.style.opacity = "1", 100);

        // 5. Tự động tải xuống (Tạo tên file theo thời gian thực để tránh trùng lặp)
        const timestamp = new Date().getTime();
        const link = document.createElement('a');
        link.download = `BanaHills_${timestamp}.png`;
        link.href = canvas.toDataURL('image/png');
        
        // Kích hoạt lệnh tải
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        // Hiện thông báo nhỏ trên màn hình web
        const toast = document.getElementById('toast');
        toast.style.display = "block";
        toast.innerText = "Đang lưu ảnh...";
        setTimeout(() => toast.style.display = "none", 1000);
    }

    window.onload = initCamera;
</script>

</body>
</html>
